<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TermikAI · Vídeo</title>
<meta name="description" content="Tráiler de TermikAI: frío y calor, calculados en la visita. BTI Pro.">
<meta property="og:image" content="portada.jpg">
<link rel="icon" href="../brand-icon.svg">
<style>
  /* Página del vídeo (se publica en /termikai/video/ con tools/publish.ts) */
  :root { --bg: #111316; --tx: #F2F3F5; --mu: #9AA0A8; --ac: #4FA3E0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--tx);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 1100px; }
  video { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  h1 { font-size: clamp(22px, 3.2vw, 32px); font-weight: 650; letter-spacing: -.01em; margin: 22px 0 4px; }
  p { margin: 0; color: var(--mu); font-size: 15px; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
  a { color: var(--ac); text-decoration: none; } a:hover { text-decoration: underline; }
  .firma { font-weight: 700; letter-spacing: .02em; color: var(--tx); }
  .firma span { color: var(--ac); font-weight: 600; }
  .credito { margin-top: 18px; font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <video src="termikai.mp4" poster="portada.jpg" controls playsinline preload="metadata"></video>
  <div class="row">
    <div>
      <h1>TermikAI</h1>
      <p>Frío y calor, calculados en la visita.</p>
    </div>
    <p class="firma">BTI <span>Pro</span></p>
  </div>
  <p class="credito">Canción: Keys Of Moon - The Epic Hero · Música proporcionada por MSC: <a href="http://bit.ly/msc-documental" rel="noopener">bit.ly/msc-documental</a></p>
</main>
</body>
</html>
